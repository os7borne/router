name: Release

# Push a tag like v0.1.0 to build Router.app and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (ad-hoc signed)
        run: ./build.sh
      - name: Package
        run: ditto -c -k --keepParent build/Router.app "Router-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Router-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ## Install
            1. Download `Router-${{ github.ref_name }}.zip` and unzip it.
            2. Drag **Router.app** to `/Applications`.
            3. This build is not notarized. The first time, right-click the app → **Open** (or allow it in System Settings → Privacy & Security).
            4. Allow Location access when asked. macOS needs it to show Wi-Fi names.

            Requires macOS 13 or later. See [CHANGELOG.md](CHANGELOG.md) for details.
